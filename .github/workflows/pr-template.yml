# The organization ruleset "main: pull request before merge (code repos)"
# runs this workflow in every repository it covers. A pull request passes when
# its body fills the repository's pull request template, or this repository's
# default when it has none. Every `##` heading the template holds outside an
# HTML comment is a required section: the body has it, in the template's
# order, with text of its own. The template's comments are guidance, so they
# never count as that text, and a section a comment offers is optional.
# Sections the template does not name are allowed. A pull request an app
# opens, such as a Version PR, passes: its body is generated.
#
# A ruleset runs it only on opened, synchronize, reopened and merge_group, so
# an edit to the body does not run it again: rerun the failed job instead. The
# check reads the body through the API, so a rerun sees the edited text.
name: PR template

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  body:
    name: PR template
    # A Namespace runner, so the check does not depend on the organization's
    # GitHub-hosted minutes (operator, 2026-11-11).
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    timeout-minutes: 5
    steps:
      - name: Check the body against the template
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.info('A merge group carries no body. Each of its pull requests passed this check.');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pr.user.type === 'Bot') {
              core.info(`${pr.user.login} is an app; its body is generated.`);
              return;
            }

            // GitHub's single-template locations, then the organization default.
            const places = ['.github/', '', 'docs/'].flatMap((dir) =>
              ['pull_request_template.md', 'PULL_REQUEST_TEMPLATE.md'].map((name) => ({
                owner,
                repo,
                path: dir + name,
                ref: pr.base.ref,
              })),
            );
            places.push({ owner, repo: '.github', path: '.github/pull_request_template.md' });

            let template;
            for (const place of places) {
              try {
                const { data } = await github.rest.repos.getContent(place);
                template = { text: Buffer.from(data.content, 'base64').toString('utf8'), url: data.html_url };
                break;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!template) {
              core.setFailed('No pull request template found, in this repository or in the organization default.');
              return;
            }

            // `##` sections outside code fences and HTML comments. A section keeps
            // its text without comments, and its first comment as the template's guidance.
            const sections = (text) => {
              const found = [];
              let fence = false;
              let comment = false;
              for (const line of text.split(/\r?\n/)) {
                let visible = '';
                let note = '';
                for (let rest = line; rest; ) {
                  const mark = rest.indexOf(comment ? '-->' : '<!--');
                  const part = mark < 0 ? rest : rest.slice(0, mark);
                  if (comment) note += part;
                  else visible += part;
                  if (mark < 0) break;
                  rest = rest.slice(mark + (comment ? 3 : 4));
                  comment = !comment;
                }
                if (!comment && !note && /^\s*(```|~~~)/.test(visible)) fence = !fence;
                const heading = !fence && /^##\s+(.+?)\s*#*\s*$/.exec(visible);
                if (heading) {
                  found.push({ title: heading[1].toLowerCase(), name: heading[1], lines: [], guidance: [] });
                } else if (found.length) {
                  const section = found[found.length - 1];
                  section.lines.push(visible);
                  if (note.trim()) section.guidance.push(note.trim());
                }
              }
              return found;
            };

            const body = sections(pr.body ?? '');
            const problems = [];
            let at = 0;
            let previous;
            for (const want of sections(template.text)) {
              const hint = want.guidance.length ? ` The template asks for: ${want.guidance[0]}` : '';
              const index = body.findIndex((have, i) => i >= at && have.title === want.title);
              if (index < 0) {
                const earlier = body.findIndex((have) => have.title === want.title);
                if (earlier >= 0) {
                  problems.push(`Move "## ${want.name}" after "## ${previous}", the template's order.`);
                } else {
                  const place = previous ? `after "## ${previous}"` : 'as the first section';
                  problems.push(`Add a "## ${want.name}" section ${place}.${hint}`);
                }
              } else {
                at = index + 1;
                if (!body[index].lines.join('\n').trim()) {
                  problems.push(`Write the "## ${want.name}" section: it holds no text outside comments.${hint}`);
                }
              }
              previous = want.name;
            }

            if (problems.length) {
              for (const problem of problems) core.error(problem);
              await core.summary
                .addRaw(`This pull request body does not follow the [pull request template](${template.url}).\n\n`)
                .addList(problems)
                .addRaw('Edit the body, then rerun this job. An edit alone does not run it again.\n')
                .write();
              core.setFailed(
                `This pull request body does not follow the template at ${template.url}: ` +
                  `${problems.length} ${problems.length === 1 ? 'section' : 'sections'} to fix. Edit the body, then rerun this job; an edit alone does not run it again.`,
              );
            } else {
              core.info(`The body follows the template at ${template.url}.`);
            }
