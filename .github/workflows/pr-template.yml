# The organization ruleset "main: pull request before merge (code repos)"
# runs this workflow in every repository it covers. A pull request passes when
# its body fills the repository's pull request template, or this repository's
# default when it has none. Every `##` heading the template holds outside an
# HTML comment is a required section: the body has it, in the template's
# order, with text of its own. The template's comments are guidance, so they
# never count as that text, and a section a comment offers is optional.
# Sections the template does not name are allowed. A pull request an app
# opens, such as a Version PR, passes: its body is generated.
#
# A ruleset runs it only on opened, synchronize, reopened and merge_group, so
# an edit to the body does not run it again: rerun the failed job instead. The
# check reads the body through the API, so a rerun sees the edited text. The
# workflow lives in this repository, so `gh run rerun` in another one fails
# with 404; the REST endpoint for the run and the Re-run button both work.
name: PR template

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  body:
    name: PR template
    # A private repository runs on Namespace, since GitHub-hosted minutes there
    # are billed; a public one runs on GitHub's runners for free. Both on
    # Ubuntu 26.04.
    runs-on: ${{ github.event.repository.private && 'nscloud-ubuntu-26.04-amd64-2x4' || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - name: Check the body against the template
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.info('A merge group carries no body. Each of its pull requests passed this check.');
              return;
            }

            const { owner, repo } = context.repo;
            const rerun =
              `Edit the body, then rerun this run with the Re-run button on ` +
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}, or with ` +
              `\`gh api -X POST repos/${owner}/${repo}/actions/runs/${context.runId}/rerun\`. ` +
              'An edit alone does not run it again.';
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pr.user.type === 'Bot') {
              core.info(`${pr.user.login} is an app; its body is generated.`);
              return;
            }

            // GitHub's single-template locations, then the organization default.
            const places = ['.github/', '', 'docs/'].flatMap((dir) =>
              ['pull_request_template.md', 'PULL_REQUEST_TEMPLATE.md'].map((name) => ({
                owner,
                repo,
                path: dir + name,
                ref: pr.base.ref,
              })),
            );
            places.push({ owner, repo: '.github', path: '.github/pull_request_template.md' });

            let template;
            for (const place of places) {
              try {
                const { data } = await github.rest.repos.getContent(place);
                template = { text: Buffer.from(data.content, 'base64').toString('utf8'), url: data.html_url };
                break;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!template) {
              core.setFailed('No pull request template found, in this repository or in the organization default.');
              return;
            }

            // `##` sections outside code fences and HTML comments. A section keeps
            // its text without comments, and its first comment as the template's guidance.
            const sections = (text) => {
              const found = [];
              let fence = false;
              let comment = false;
              for (const line of text.split(/\r?\n/)) {
                let visible = '';
                let note = '';
                for (let rest = line; rest; ) {
                  const mark = rest.indexOf(comment ? '-->' : '<!--');
                  const part = mark < 0 ? rest : rest.slice(0, mark);
                  if (comment) note += part;
                  else visible += part;
                  if (mark < 0) break;
                  rest = rest.slice(mark + (comment ? 3 : 4));
                  comment = !comment;
                }
                if (!comment && !note && /^\s*(```|~~~)/.test(visible)) fence = !fence;
                const heading = !fence && /^##\s+(.+?)\s*#*\s*$/.exec(visible);
                if (heading) {
                  found.push({ title: heading[1].toLowerCase(), name: heading[1], lines: [], guidance: [] });
                } else if (found.length) {
                  const section = found[found.length - 1];
                  section.lines.push(visible);
                  if (note.trim()) section.guidance.push(note.trim());
                }
              }
              return found;
            };

            const body = sections(pr.body ?? '');
            const problems = [];
            let at = 0;
            let previous;
            for (const want of sections(template.text)) {
              const hint = want.guidance.length ? ` The template asks for: ${want.guidance[0]}` : '';
              const index = body.findIndex((have, i) => i >= at && have.title === want.title);
              if (index < 0) {
                const earlier = body.findIndex((have) => have.title === want.title);
                if (earlier >= 0) {
                  problems.push(`Move "## ${want.name}" after "## ${previous}", the template's order.`);
                } else {
                  const place = previous ? `after "## ${previous}"` : 'as the first section';
                  problems.push(`Add a "## ${want.name}" section ${place}.${hint}`);
                }
              } else {
                at = index + 1;
                if (!body[index].lines.join('\n').trim()) {
                  problems.push(`Write the "## ${want.name}" section: it holds no text outside comments.${hint}`);
                }
              }
              previous = want.name;
            }

            if (problems.length) {
              for (const problem of problems) core.error(problem);
              await core.summary
                .addRaw(`This pull request body does not follow the [pull request template](${template.url}).\n\n`)
                .addList(problems)
                .addRaw(`${rerun}\n`)
                .write();
              core.setFailed(
                `This pull request body does not follow the template at ${template.url}: ` +
                  `${problems.length} ${problems.length === 1 ? 'section' : 'sections'} to fix. ${rerun}`,
              );
            } else {
              core.info(`The body follows the template at ${template.url}.`);
            }


  # Lints the title and body with Vale and the ProseStyle and PullRequestStyle
  # packages, with the same levels in every repository: a repository's own
  # .vale.ini never applies here, and no repository overrides a level until
  # the check moves to hakkiri (operator, 2026-11-11). The check run "PR prose
  # findings" lists every alert: it fails on an error, is neutral on warnings
  # and suggestions, and passes on none. This job fails on an error only.
  prose:
    name: PR prose
    runs-on: ${{ github.event.repository.private && 'nscloud-ubuntu-26.04-amd64-2x4' || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # The "PR prose findings" check run.
      checks: write
    env:
      VALE_VERSION: 3.26.0
      # vale_3.26.0_checksums.txt, Linux_64-bit.
      VALE_SHA256: 22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed
      PACKAGES: >-
        https://github.com/victor-software-house/prose-style/releases/download/v0.0.14/ProseStyle.zip,
        https://github.com/victor-software-house/prose-style/releases/download/v0.0.15/PullRequestStyle.zip
    steps:
      # A merge group carries no title or body, and an app's text is generated.
      - name: Skip a merge group or an app
        id: scope
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        run: echo "lint=true" >> "$GITHUB_OUTPUT"
      - name: Install Vale
        if: steps.scope.outputs.lint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vale.tar.gz" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check --quiet -
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP" vale
      - name: Check the title and body
        if: steps.scope.outputs.lint
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const dir = path.join(process.env.RUNNER_TEMP, 'prose');
            fs.mkdirSync(dir, { recursive: true });

            // Read through the API, so a rerun sees an edited title or body.
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
            });

            fs.writeFileSync(
              path.join(dir, '.vale.ini'),
              `StylesPath = styles\nMinAlertLevel = suggestion\nPackages = ${process.env.PACKAGES}\n`,
            );

            const entities = { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'", '#x27': "'" };
            const decode = (s) => s.replace(/&(amp|lt|gt|quot|#39|#x27);/g, (_, e) => entities[e]);
            const escape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            // Writes each reference GitHub turns into a link, such as #12,
            // owner/repo#12, an autolinked VER-117 or @someone, as a Markdown
            // link, so the rules read it as one. A reference GitHub leaves as
            // text stays bare, and so do a pasted URL and text in code, in a
            // link or in an HTML tag.
            const linkify = async (text) => {
              if (!text.trim()) return text;
              const { data: html } = await github.rest.markdown.render({
                text,
                mode: 'gfm',
                context: `${owner}/${repo}`,
              });
              const links = new Map();
              for (const [, href, label] of html.matchAll(/<a\s[^>]*?href="([^"]+)"[^>]*>([^<]+)<\/a>/g)) {
                const name = decode(label).trim();
                if (name && !/^[a-z]+:\/\//i.test(name) && decode(href) !== name) links.set(name, decode(href));
              }
              if (!links.size) return text;
              const names = [...links.keys()].sort((a, b) => b.length - a.length).map(escape);
              const bare = new RegExp(`(?<![\\w/\\[-])(${names.join('|')})(?![\\w-])`, 'g');
              const link = (part) => part.replace(bare, (name) => `[${name}](${links.get(name)})`);
              const kept = /(`+)[\s\S]*?\1|!?\[[^\]]*\]\([^)]*\)|\[[^\]]*\]\[[^\]]*\]|<[^>\n]+>/g;
              let fence = null;
              return text
                .split('\n')
                .map((line) => {
                  const mark = /^\s*(`{3,}|~{3,})/.exec(line);
                  if (fence) {
                    if (mark && mark[1][0] === fence[0] && mark[1].length >= fence.length) fence = null;
                    return line;
                  }
                  if (mark) {
                    fence = mark[1];
                    return line;
                  }
                  let out = '';
                  let at = 0;
                  for (const m of line.matchAll(kept)) {
                    out += link(line.slice(at, m.index)) + m[0];
                    at = m.index + m[0].length;
                  }
                  return out + link(line.slice(at));
                })
                .join('\n');
            };

            const files = { 'title.pr-title': 'title', 'body.pr-body': 'body' };
            // A title cannot hold a link, and by house convention it ends with
            // the queue rows it closes, as in `fix: keep a comma (VER-117)`.
            // Those trailing ids read as code; a bare id elsewhere stays an error.
            const subject = pr.title.replace(
              /\(((?:[A-Z][A-Z0-9]{1,6}-\d+)(?:,\s*[A-Z][A-Z0-9]{1,6}-\d+)*)\)\s*$/,
              (_, ids) => `(${ids.split(/,\s*/).map((id) => `\`${id}\``).join(', ')})`,
            );
            fs.writeFileSync(path.join(dir, 'title.pr-title'), `${await linkify(subject)}\n`);
            fs.writeFileSync(path.join(dir, 'body.pr-body'), `${await linkify((pr.body ?? '').replace(/\r\n/g, '\n'))}\n`);

            const vale = path.join(process.env.RUNNER_TEMP, 'vale');
            await exec.exec(vale, ['sync'], { cwd: dir });
            const run = await exec.getExecOutput(vale, ['--output', 'JSON', ...Object.keys(files)], {
              cwd: dir,
              ignoreReturnCode: true,
              silent: true,
            });
            let report;
            try {
              report = JSON.parse(run.stdout || '{}');
            } catch {
              report = null;
            }
            // A runtime error prints one object with a Code instead of alerts
            // per file.
            if (!report || report.Code) {
              core.setFailed(`Vale did not run: ${report?.Text ?? (run.stderr || run.stdout)}`);
              return;
            }

            const order = { error: 0, warning: 1, suggestion: 2 };
            const alerts = Object.entries(report)
              .flatMap(([file, list]) =>
                list.map((a) => ({
                  where: files[path.basename(file)] === 'title' ? 'title' : `body line ${a.Line}`,
                  level: a.Severity,
                  rule: a.Check,
                  message: a.Message,
                })),
              )
              .sort((a, b) => order[a.level] - order[b.level]);
            const count = (level) => alerts.filter((a) => a.level === level).length;
            const errors = count('error');
            const warnings = count('warning');
            const suggestions = count('suggestion');

            for (const a of alerts) {
              const line = `${a.where}: ${a.message} (${a.rule})`;
              if (a.level === 'error') core.error(line);
              else if (a.level === 'warning') core.warning(line);
              else core.notice(line);
            }

            const cell = (s) => s.replace(/\|/g, '\\|').replace(/\n/g, ' ');
            const table = alerts.length
              ? [
                  '| Where | Level | Rule | Message |',
                  '|:--|:--|:--|:--|',
                  ...alerts.map((a) => `| ${a.where} | ${a.level} | \`${a.rule}\` | ${cell(a.message)} |`),
                ].join('\n')
              : 'No alerts.';
            const title = alerts.length
              ? `${errors} errors, ${warnings} warnings, ${suggestions} suggestions`
              : 'No alerts';
            const help =
              `After an edit to the title or body, rerun this run with the Re-run button on ` +
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}, or with ` +
              `\`gh api -X POST repos/${owner}/${repo}/actions/runs/${context.runId}/rerun\`. ` +
              'An edit alone does not run it again.';
            const summary = `${table}\n\n${help}\n`;

            await github.rest.checks.create({
              owner,
              repo,
              name: 'PR prose findings',
              head_sha: pr.head.sha,
              status: 'completed',
              conclusion: errors ? 'failure' : alerts.length ? 'neutral' : 'success',
              output: { title, summary: summary.slice(0, 65000) },
            });
            await core.summary.addRaw(summary).write();

            if (errors) {
              core.setFailed(`${title} in the title or body. ${help}`);
            }
